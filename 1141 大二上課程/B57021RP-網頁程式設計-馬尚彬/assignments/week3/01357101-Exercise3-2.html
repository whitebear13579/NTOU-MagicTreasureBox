      <style type = "text/css">
         body {
            font-family: "Perpetua";
         }
         h1{
            text-align: center;
            color: royalblue;
         }
         .flex-container {
            display: flex;
            box-sizing: border-box;
            width: 100%;
         }
         .flex-container > div{
            border: 2px solid RoyalBlue;
            background-color: RoyalBlue;
            box-sizing: border-box;
            width: calc(100% / 6);
         }
         nav {
            font-weight: bold;
            color: white;
            text-align: center;
            background-color: RoyalBlue;
            position: relative;
         }
         nav ul {
            display: none;
            list-style: none;
            margin: 0;
            padding: 0;
            position: absolute;
            width: 100%;
            box-sizing: border-box;
         }
         nav:hover ul {
            display: block;
         }
         nav ul li {
            border-bottom: 2px solid RoyalBlue;
            border-left: 2px solid RoyalBlue;
            border-right: 2px solid RoyalBlue;
            background-color: white;
            color: black;
         }
         nav ul li:first-child {
            margin-top: 3px;
         }
         nav ul li:hover {
            background-color: PowderBlue;
         }
         a {
            text-decoration: none;
         }
         iframe {
            display: block;
            box-sizing: border-box;
         }
          @media only screen and (max-width: 600px) {
            .flex-container{
               flex-direction: column;
            }
            .flex-container > div {
               width: 100%;
            }
            .flex-container > div ul {
               width: 100%;
               position: relative;
            }
            nav ul li {
               border-left: none;
               border-right: none;
            }
        }
      </style>
   </head>
