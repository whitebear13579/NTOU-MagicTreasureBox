<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Programming week8 8-1</title>
    <style>
        @import url(https://fonts.googleapis.com/earlyaccess/cwtexkai.css);

        body {
            font-family: "Noto Sans TC", Perpetua, serif;
            max-width: 600px;
            margin: 20px auto;
            text-align: center;
            background-color: #f5f5f5;
        }

        #gadget {
            width: 300px;
            height: 300px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background-color: white;
            margin: 20px auto;
            display: block;
        }

        #play {
            width: 200px;
            height: 60px;
            font-size: 120%;
            padding: 10px 0;
            background-color: dodgerblue;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            display: block;
            margin: 20px auto;
        }

        #play:hover {
            background-color: rgba(30, 144, 255, 0.8);
        }

        #messages {
            font-size: 120%;
            width: 300px;
            padding: 15px;
            background-color: white;
            border: 1px solid #d0d0d0;
            border-radius: 8px;
            margin: 20px auto;
            box-sizing: border-box;
            min-height: 80px;
        }
    </style>
    <script>
        // 00是哆啦A夢 blank 是灰背景
        const gadgetString = "任意門 時光機 竹蜻蜓 時光布 記憶麵包 縮小燈 翻譯蒟蒻 如果電話亭 穿透環 更衣照相機";
        const gadgets = gadgetString.split(" ");
        const imgAry = [
            "./img8-1/01.png",
            "./img8-1/02.png",
            "./img8-1/03.png",
            "./img8-1/04.png",
            "./img8-1/05.png",
            "./img8-1/06.png",
            "./img8-1/07.png",
            "./img8-1/08.png",
            "./img8-1/09.png",
            "./img8-1/10.png",
        ];

        function display(){
            let idx = Math.floor(Math.random() * gadgets.length);
            imgSet = document.getElementById("gadget")
            msgSet = document.getElementById("messages")

            imgSet.src = imgAry[idx];
            msgSet.innerHTML = "您抽到" + gadgets[idx] + "!";
        }

        function start(){
            msgPending = document.getElementById("messages")
            msgPending.innerHTML = ""
            imgPending = document.getElementById("gadget");
            imgPending.src = "./img8-1/blank.png";
            audio = document.getElementById("sound");
            audio.play()
            audio.addEventListener("ended", display, false)
        }
    </script>
</head>

<body>  
    <audio id="sound" preload="auto">
        <source src="doraemon.mp3" type="audio/mpeg">
        Browser does not support audio tag
    </audio>

    <img id="gadget" src="./img8-1/00.png" alt="gadget">
    <form action="#">
        <input id="play" type="button" value="抽道具" onclick="start()">
    </form>
    <div id="messages">請按下Button抽出道具</div>
</body>

</html>
