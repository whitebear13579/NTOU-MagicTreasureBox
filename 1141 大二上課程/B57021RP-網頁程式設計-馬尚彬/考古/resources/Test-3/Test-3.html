<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Doraemon</title>
    <style type="text/css">
        h2 {
            font-family: Helvetica, "Microsoft YaHei", "LiHei Pro", TW-Kai;
            color: navy;
            margin-bottom: 0px;
        }

        div {
            text-align: center;
        }

        img.big {
            width: 360px;
            height: 360px;
        }
    </style>
    <script>
        const gadgetNames = "任意門 時光機 竹蜻蜓 時光布 記憶麵包 縮小燈 翻譯蒟蒻 如果電話亭 穿透環 更衣照相機";
        const picAry = ["./00.png", "./01.png", "./02.png", "./03.png", "./04.png", "./05.png", "./06.png", "./07.png", "./08.png", "./09.png", "./10.png"]
        
        function fuck( imgID ){
            let words = (gadgetNames.split(" "))[imgID-1];
            let nmsl = document.getElementById("big-gadget-image");
            let wrnm = document.getElementById("gadget-name");
            nmsl.src = picAry[imgID];
            wrnm.innerHTML = words;
        }

        function start(){
            for ( let i = 1 ; i <= 10 ; i++ ){
                let element = document.getElementById(`small-gadget-${i}`);
                element.src = picAry[i];
                element.addEventListener("click", () => fuck(i), false);
            }
        }
        
        window.addEventListener("load", start, false);
    </script>
</head>

<body>

    <div>
        <h2 id="gadget-name">哆啦A夢道具</h2>
        <img id="big-gadget-image" class="big" src="00.png" alt="gadget">
    </div>

    <div>
        <img id="small-gadget-1" src="blank.png" alt="small gadget 1" width="80">
        <img id="small-gadget-2" src="blank.png" alt="small gadget 2" width="80">
        <img id="small-gadget-3" src="blank.png" alt="small gadget 3" width="80">
        <img id="small-gadget-4" src="blank.png" alt="small gadget 4" width="80">
        <img id="small-gadget-5" src="blank.png" alt="small gadget 5" width="80">
        <img id="small-gadget-6" src="blank.png" alt="small gadget 6" width="80">
        <img id="small-gadget-7" src="blank.png" alt="small gadget 7" width="80">
        <img id="small-gadget-8" src="blank.png" alt="small gadget 8" width="80">
        <img id="small-gadget-9" src="blank.png" alt="small gadget 9" width="80">
        <img id="small-gadget-10" src="blank.png" alt="small gadget 10" width="80">
    </div>
</body>

</html>
