<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Basic DOM</title>
    <style type="text/CSS">
        h1 {
			font-size: 50px;
			font-family: 'Arial', sans-serif;
		}

		div {
			font-size: 80px;
			font-family: Consolas;
			margin: 5px;
            padding: 5px;
		}

        div.number {
			border: 1px solid gray;			
			color: dodgerblue;
            min-width: 100px;
            text-align: center;           
		}

	</style>
</head>

<body>
    <h1>Arithmetic Operation Result:</h1>
    <div class="number" id="num1">Number1</div>
    <div id="op">?</div>
    <div class="number" id="num2">Number2</div>
    <div>=</div>
    <div class="number" id="result">Result</div>   
</body>

</html>
